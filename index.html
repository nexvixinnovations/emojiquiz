<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess The Sport &#x1F3C6;</title>
  <meta name="description" content="Emoji rebus sports quiz — decode the image clues to name the sport!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal-1: #0FBFB0;
      --teal-2: #14D6C4;
      --card-bg: rgba(255,255,255,0.97);
      --text-dark: #1a2a35;
      --text-mid: #3a5a68;
      --red-1: #FF6B8A;
      --red-2: #FF2D55;
      --shadow-card: 0 24px 60px rgba(0,0,0,0.22), 0 4px 16px rgba(0,0,0,0.12);
    }

    html, body { height: 100%; font-family: 'Fredoka', sans-serif; overflow-x: hidden; }

    body {
      background: linear-gradient(135deg, var(--teal-1) 0%, var(--teal-2) 100%);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px; position: relative;
    }

    /* ── Floating sparkles ── */
    .sparkle-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .sparkle {
      position: absolute; opacity: 0;
      animation: floatSpark linear infinite;
      color: rgba(255,255,255,0.75);
      user-select: none; pointer-events: none;
    }
    @keyframes floatSpark {
      0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* ── Page ── */
    .page {
      position: relative; z-index: 1;
      width: 100%; max-width: 620px;
      display: flex; flex-direction: column;
      align-items: center; gap: 20px;
    }

    /* ── Title ── */
    .title {
      font-size: clamp(2rem, 8vw, 3.2rem);
      font-weight: 700; color: #fff; text-align: center;
      text-shadow: 0 3px 12px rgba(0,0,0,0.25), 0 1px 4px rgba(0,0,0,0.15);
      line-height: 1.15;
    }
    .title-sub {
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      color: rgba(255,255,255,0.82); text-align: center;
      font-weight: 500; margin-top: -6px;
    }

    /* ── Progress ── */
    .progress-wrap { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .progress-label {
      color: rgba(255,255,255,0.92); font-size: 1rem;
      font-weight: 600; text-align: center;
    }
    .progress-bar-bg {
      width: 100%; height: 10px;
      background: rgba(255,255,255,0.3); border-radius: 99px;
      overflow: hidden; box-shadow: inset 0 1px 4px rgba(0,0,0,0.15);
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,0.82) 100%);
      border-radius: 99px;
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 0 10px rgba(255,255,255,0.6);
    }

    /* ── Card ── */
    .card-wrapper { width: 100%; }
    .card {
      background: var(--card-bg); border-radius: 28px;
      padding: 32px 28px 30px;
      box-shadow: var(--shadow-card);
      border: 2.5px solid rgba(255,255,255,0.9);
      display: flex; flex-direction: column;
      align-items: center; gap: 24px;
      animation: bounceIn 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards;
      position: relative; overflow: hidden;
    }
    .card.slide-out-left  { animation: slideOutLeft  0.35s cubic-bezier(0.4,0,0.6,1) forwards; }
    .card.slide-out-right { animation: slideOutRight 0.35s cubic-bezier(0.4,0,0.6,1) forwards; }
    .card.slide-in-left   { animation: slideInLeft   0.52s cubic-bezier(0.34,1.56,0.64,1) forwards; }

    @keyframes bounceIn {
      0%   { opacity: 0; transform: scale(0.82) translateY(28px); }
      60%  { opacity: 1; transform: scale(1.03) translateY(-4px); }
      80%  { transform: scale(0.98) translateY(2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes slideOutLeft {
      0%   { opacity: 1; transform: translateX(0) scale(1); }
      100% { opacity: 0; transform: translateX(-70px) scale(0.92); }
    }
    @keyframes slideOutRight {
      0%   { opacity: 1; transform: translateX(0) scale(1); }
      100% { opacity: 0; transform: translateX(70px) scale(0.92); }
    }
    @keyframes slideInLeft {
      0%   { opacity: 0; transform: translateX(60px) scale(0.9); }
      60%  { opacity: 1; transform: translateX(-4px) scale(1.02); }
      80%  { transform: translateX(2px) scale(0.99); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    /* ── Rebus image ── */
    .rebus-label {
      font-size: 0.8rem; font-weight: 600;
      color: rgba(26,42,53,0.38); letter-spacing: 0.9px;
      text-transform: uppercase; margin-bottom: -8px;
    }
    .rebus-img-wrap {
      width: 100%;
      display: flex; align-items: center; justify-content: center;
      border-radius: 18px; overflow: hidden;
      background: #f0f4f8;
      min-height: 160px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      animation: imgFadeIn 0.4s ease forwards;
    }
    @keyframes imgFadeIn {
      0%   { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }
    .rebus-img {
      width: 100%;
      height: auto;
      max-height: 220px;
      object-fit: contain;
      display: block;
      border-radius: 18px;
    }
    /* Glow on reveal */
    .rebus-img-wrap.glowing {
      animation: imgGlow 1s ease forwards;
    }
    @keyframes imgGlow {
      0%   { box-shadow: 0 2px 12px rgba(0,0,0,0.08); transform: scale(1); }
      35%  { box-shadow: 0 0 0 4px rgba(255,255,255,0.95),
                         0 0 30px rgba(255,213,0,0.7),
                         0 4px 20px rgba(0,0,0,0.1);
             transform: scale(1.025); }
      65%  { box-shadow: 0 0 0 3px rgba(255,255,255,0.7),
                         0 0 48px rgba(255,213,0,0.45); }
      100% { box-shadow: 0 2px 12px rgba(0,0,0,0.08); transform: scale(1); }
    }

    /* ── Answer area ── */
    .answer-area {
      width: 100%; min-height: 58px;
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
    }
    .answer-text {
      font-size: clamp(1.9rem, 6vw, 2.7rem);
      font-weight: 700; color: var(--text-dark);
      text-align: center; line-height: 1.1;
      opacity: 0; transform: translateY(14px) scale(0.88);
      transition: opacity 0.42s ease, transform 0.42s cubic-bezier(0.34,1.3,0.64,1);
    }
    .answer-text.visible { opacity: 1; transform: translateY(0) scale(1); }
    .answer-hint {
      font-size: 0.95rem; font-weight: 500;
      color: rgba(26,42,53,0.35); text-align: center;
    }

    /* ── Button row ── */
    .btn-row {
      display: flex; gap: 12px; align-items: center;
      flex-wrap: wrap; justify-content: center;
    }

    .action-btn {
      border: none; cursor: pointer; border-radius: 99px;
      font-family: 'Fredoka', sans-serif; font-weight: 600;
      font-size: 1.05rem; letter-spacing: 0.4px;
      padding: 13px 30px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
      outline: none; -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .action-btn:active { transform: scale(0.95) !important; }

    /* Keyboard-focus ring (for ← cursor navigation) */
    .action-btn:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .btn-prev {
      background: rgba(255,255,255,0.18);
      color: var(--text-dark);
      border: 2px solid rgba(255,255,255,0.6);
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      backdrop-filter: blur(4px);
    }
    .btn-prev:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,0.15); }
    .btn-prev:disabled {
      opacity: 0.3; cursor: not-allowed; pointer-events: none;
    }

    .btn-reveal {
      background: linear-gradient(135deg, var(--red-1), var(--red-2));
      color: #fff; box-shadow: 0 6px 20px rgba(255,45,85,0.4);
    }
    .btn-reveal:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,45,85,0.5); }

    .btn-next {
      background: linear-gradient(135deg, #0FBFB0, #14D6C4);
      color: #fff; box-shadow: 0 6px 20px rgba(15,191,176,0.4);
    }
    .btn-next:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(15,191,176,0.5); }

    .btn-divider {
      font-size: 0.82rem; color: rgba(26,42,53,0.28);
      font-weight: 500; width: 100%; text-align: center;
    }

    /* ── Confetti container (inside card) ── */
    .confetti-container {
      position: absolute; inset: 0;
      pointer-events: none; overflow: hidden;
      border-radius: 28px; z-index: 10;
    }
    .confetti-piece {
      position: absolute; border-radius: 2px; opacity: 0;
      animation: confettiFall 1.1s ease forwards;
    }
    @keyframes confettiFall {
      0%   { opacity: 1; transform: translate(0,0) rotate(0deg) scale(1); }
      80%  { opacity: 0.7; }
      100% { opacity: 0; transform: translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(0.4); }
    }

    /* ── Keyboard hint ── */
    .key-hints {
      display: flex; gap: 16px; align-items: center;
      color: rgba(255,255,255,0.75); font-size: 0.88rem;
      font-weight: 500; flex-wrap: wrap; justify-content: center;
    }
    .key-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.38);
      border-radius: 7px; padding: 2px 9px;
      font-size: 0.8rem; letter-spacing: 0.3px;
    }

    /* ── End screen ── */
    .end-screen {
      background: var(--card-bg); border-radius: 28px;
      padding: 50px 32px 42px;
      box-shadow: var(--shadow-card);
      border: 2.5px solid rgba(255,255,255,0.9);
      display: flex; flex-direction: column;
      align-items: center; gap: 20px; text-align: center;
      animation: bounceIn 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    .end-emoji { font-size: 4rem; animation: spinPop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    @keyframes spinPop {
      0%   { opacity: 0; transform: rotate(-50deg) scale(0.4); }
      100% { opacity: 1; transform: rotate(0deg) scale(1); }
    }
    .end-title   { font-size: 2.3rem; font-weight: 700; color: var(--text-dark); }
    .end-subtitle { font-size: 1.1rem; color: var(--text-mid); font-weight: 500; max-width: 320px; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { padding: 24px 14px 22px; gap: 18px; }
      .rebus-img { max-height: 160px; }
      .action-btn { padding: 12px 22px; font-size: 0.98rem; }
      .btn-row { gap: 8px; }
    }
  </style>
</head>
<body>

<div class="sparkle-layer" id="sparkleLayer" aria-hidden="true"></div>

<main class="page" id="mainPage">
  <div>
    <h1 class="title">&#x1F914; Guess The Sport</h1>
    <p class="title-sub">Decode the rebus picture to name the sport</p>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label" id="progressLabel">Question 1 of 13</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="card-wrapper" id="cardWrapper"></div>

  <div class="key-hints" id="keyHints">
    <span><span class="key-badge">&#x2190;</span> Previous</span>
    <span><span class="key-badge">SPACE</span> Reveal / Next</span>
  </div>
</main>

<script>
// ============================================================
//  QUESTION DATA
//  image: path to the rebus image (relative to HTML file)
//  answer: the sport name
// ============================================================
const QUESTIONS = [
  { image: 'images/1.png',  answer: 'Archery' },
  { image: 'images/2.png',  answer: 'Volleyball' },
  { image: 'images/3.png',  answer: 'Badminton' },
  { image: 'images/4.png',  answer: 'Golf' },
  { image: 'images/5.png',  answer: 'Tennis' },
  { image: 'images/6.png',  answer: 'American Football' },
  { image: 'images/7.png',  answer: 'Ice Hockey' },
  { image: 'images/8.png',  answer: 'Karate' },
  { image: 'images/9.png',  answer: 'Formula 1' },
  { image: 'images/10.png', answer: 'Table Tennis' },
  { image: 'images/11.png', answer: 'Bowling' },
  { image: 'images/12.png', answer: 'Wrestling' },
  { image: 'images/13.png', answer: 'Triathlon' },
];

const CONF_COLORS = ['#FF4E6A','#FFD700','#14D6C4','#A78BFA','#FB923C','#34D399'];
const TOTAL = QUESTIONS.length;

// State
let idx        = 0;
let revealed   = false;
let animating  = false;

// ── Sparkles ──────────────────────────────────────────────
(function(){
  const layer = document.getElementById('sparkleLayer');
  const chars = ['\u2726','\u2727','\u2605','\u22C6','\u2735','\u273A','\u2736'];
  for(let i = 0; i < 32; i++){
    const el = document.createElement('div');
    el.className = 'sparkle';
    el.textContent = chars[i % chars.length];
    const sz = 8 + Math.random() * 11;
    el.style.cssText = [
      'left:' + (Math.random() * 100) + '%',
      'bottom:-24px',
      'font-size:' + sz + 'px',
      'animation-duration:' + (6 + Math.random() * 11) + 's',
      'animation-delay:-' + (Math.random() * 15) + 's'
    ].join(';');
    layer.appendChild(el);
  }
})();

// ── Confetti helpers ───────────────────────────────────────
function spawnCardConfetti(){
  const c = document.getElementById('confettiCont');
  if(!c) return;
  c.innerHTML = '';
  const cx = c.offsetWidth / 2, cy = c.offsetHeight / 2;
  for(let i = 0; i < 46; i++){
    const p   = document.createElement('div');
    p.className = 'confetti-piece';
    const ang  = (i / 46) * 360 + Math.random() * 10;
    const dist = 60 + Math.random() * 160;
    const rad  = ang * Math.PI / 180;
    const tx   = Math.cos(rad) * dist;
    const ty   = Math.sin(rad) * dist - 30;
    const rot  = Math.random() * 720 - 360;
    const w    = 6 + Math.random() * 7;
    p.style.cssText = [
      'left:' + cx + 'px', 'top:' + cy + 'px',
      'background:' + CONF_COLORS[i % CONF_COLORS.length],
      '--tx:' + tx + 'px', '--ty:' + ty + 'px', '--rot:' + rot + 'deg',
      'width:' + w + 'px', 'height:' + w + 'px',
      'border-radius:' + (Math.random() > 0.5 ? '50%' : '2px'),
      'animation-delay:' + (Math.random() * 0.08) + 's'
    ].join(';');
    c.appendChild(p);
  }
}

function bigConfetti(){
  const all = [...CONF_COLORS, '#ffffff'];
  for(let i = 0; i < 90; i++){
    const p = document.createElement('div');
    const w = 7 + Math.random() * 8;
    p.style.cssText = [
      'position:fixed',
      'left:' + (Math.random() * window.innerWidth) + 'px',
      'top:'  + (Math.random() * window.innerHeight * 0.5) + 'px',
      'width:' + w + 'px', 'height:' + w + 'px',
      'background:' + all[Math.floor(Math.random() * all.length)],
      'border-radius:' + (Math.random() > 0.5 ? '50%' : '3px'),
      '--tx:' + ((Math.random() - 0.5) * 340) + 'px',
      '--ty:' + (60 + Math.random() * 210) + 'px',
      '--rot:' + (Math.random() * 720 - 360) + 'deg',
      'opacity:0', 'pointer-events:none', 'z-index:9999',
      'animation:confettiFall ' + (0.9 + Math.random() * 0.7) + 's ease forwards',
      'animation-delay:' + (Math.random() * 0.35) + 's'
    ].join(';');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 2400);
  }
}

// ── Build / render a question card ────────────────────────
function render(i, direction){
  // direction: 'next' (default bounce-in), 'prev' (slide from right)
  const q = QUESTIONS[i];
  revealed = false;

  document.getElementById('progressLabel').textContent =
    'Question ' + (i + 1) + ' of ' + TOTAL;
  document.getElementById('progressFill').style.width =
    (i / TOTAL * 100) + '%';

  const wrapper = document.getElementById('cardWrapper');
  wrapper.innerHTML = '';

  const card = document.createElement('div');
  card.className = direction === 'prev' ? 'card slide-in-left' : 'card';
  card.id = 'theCard';

  /* confetti container */
  const cc = document.createElement('div');
  cc.className = 'confetti-container'; cc.id = 'confettiCont';
  card.appendChild(cc);

  /* rebus label */
  const lbl = document.createElement('div');
  lbl.className = 'rebus-label';
  lbl.textContent = 'Rebus Clue';
  card.appendChild(lbl);

  /* image */
  const imgWrap = document.createElement('div');
  imgWrap.className = 'rebus-img-wrap'; imgWrap.id = 'imgWrap';
  const img = document.createElement('img');
  img.className = 'rebus-img';
  img.src = q.image;
  img.alt = 'Rebus clue for question ' + (i + 1);
  img.draggable = false;
  imgWrap.appendChild(img);
  card.appendChild(imgWrap);

  /* answer area */
  const aa = document.createElement('div');
  aa.className = 'answer-area';
  const at = document.createElement('div');
  at.className = 'answer-text'; at.id = 'ansText';
  at.textContent = q.answer;
  aa.appendChild(at);
  const hint = document.createElement('div');
  hint.className = 'answer-hint'; hint.id = 'ansHint';
  hint.textContent = '\u2753 \u2753 \u2753';
  aa.appendChild(hint);
  card.appendChild(aa);

  /* button row */
  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';

  // ← Previous button
  const prevBtn = document.createElement('button');
  prevBtn.className = 'action-btn btn-prev'; prevBtn.id = 'prevBtn';
  prevBtn.textContent = '\u2190 Previous';
  prevBtn.setAttribute('aria-label', 'Go to previous question');
  if(i === 0) prevBtn.disabled = true;
  prevBtn.addEventListener('click', goBack);
  btnRow.appendChild(prevBtn);

  // Reveal / Next button
  const mainBtn = document.createElement('button');
  mainBtn.className = 'action-btn btn-reveal'; mainBtn.id = 'mainBtn';
  mainBtn.textContent = '\uD83D\uDC41\uFE0F  Reveal Answer';
  mainBtn.setAttribute('aria-label', 'Reveal the answer');
  mainBtn.addEventListener('click', advance);
  btnRow.appendChild(mainBtn);

  card.appendChild(btnRow);

  /* space hint */
  const divider = document.createElement('div');
  divider.className = 'btn-divider';
  divider.textContent = '\u2014 or press SPACE / \u2190 arrow \u2014';
  card.appendChild(divider);

  wrapper.appendChild(card);
}

// ── Reveal answer ──────────────────────────────────────────
function doReveal(){
  revealed = true;

  const at      = document.getElementById('ansText');
  const hint    = document.getElementById('ansHint');
  const mainBtn = document.getElementById('mainBtn');
  const imgWrap = document.getElementById('imgWrap');

  at.classList.add('visible');
  if(hint) hint.style.display = 'none';

  imgWrap.classList.add('glowing');
  spawnCardConfetti();

  mainBtn.className = 'action-btn btn-next';
  mainBtn.textContent = (idx === TOTAL - 1)
    ? '\uD83C\uDF89  See Results'
    : '\u27A1\uFE0F  Next Question';
  mainBtn.setAttribute('aria-label',
    idx === TOTAL - 1 ? 'See results' : 'Go to next question');
}

// ── Navigate backwards ─────────────────────────────────────
function goBack(){
  if(animating || idx === 0) return;
  animating = true;
  const card = document.getElementById('theCard');
  if(card){
    card.classList.add('slide-out-right');
    setTimeout(() => {
      idx--;
      render(idx, 'prev');
      animating = false;
    }, 340);
  }
}

// ── Navigate forward (state machine) ──────────────────────
function advance(){
  if(animating) return;

  if(!revealed){
    // State: QUESTION → ANSWER
    doReveal();
  } else {
    // State: ANSWER → NEXT
    if(idx === TOTAL - 1){ showEnd(); return; }
    animating = true;
    const card = document.getElementById('theCard');
    if(card){
      card.classList.add('slide-out-left');
      setTimeout(() => {
        idx++;
        render(idx, 'next');
        animating = false;
      }, 350);
    }
  }
}

// ── End screen ─────────────────────────────────────────────
function showEnd(){
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = 'Quiz Complete!';
  const kh = document.getElementById('keyHints');
  if(kh) kh.style.display = 'none';

  const old = document.getElementById('theCard');
  if(old){
    old.classList.add('slide-out-left');
    setTimeout(() => {
      const w = document.getElementById('cardWrapper');
      w.innerHTML = '';
      const end = document.createElement('div');
      end.className = 'end-screen';
      end.innerHTML =
        '<div class="end-emoji">\uD83C\uDFC6</div>' +
        '<div class="end-title">Quiz Complete!</div>' +
        '<div class="end-subtitle">You decoded all 13 sports rebuses \u2014 how many did you crack?</div>' +
        '<button class="action-btn btn-next" id="restartBtn" style="padding:15px 46px;font-size:1.1rem">' +
          '\uD83D\uDD04  Play Again' +
        '</button>';
      w.appendChild(end);
      document.getElementById('restartBtn').addEventListener('click', restart);
      bigConfetti();
    }, 350);
  }
}

// ── Restart ────────────────────────────────────────────────
function restart(){
  idx = 0; revealed = false; animating = false;
  const kh = document.getElementById('keyHints');
  if(kh) kh.style.display = '';
  render(0, 'next');
}

// ── Keyboard navigation ────────────────────────────────────
document.addEventListener('keydown', function(e){
  // SPACE: reveal or advance
  if(e.code === 'Space'){
    e.preventDefault();
    advance();
    return;
  }
  // LEFT ARROW: go back (Previous)
  if(e.code === 'ArrowLeft'){
    e.preventDefault();
    // Visually focus the prev button briefly for feedback
    const pb = document.getElementById('prevBtn');
    if(pb && !pb.disabled){
      pb.focus();
      goBack();
    }
    return;
  }
  // RIGHT ARROW: same as SPACE (advance)
  if(e.code === 'ArrowRight'){
    e.preventDefault();
    const mb = document.getElementById('mainBtn');
    if(mb) mb.focus();
    advance();
    return;
  }
});

// ── Init ───────────────────────────────────────────────────
render(0, 'next');
</script>
</body>
</html>
